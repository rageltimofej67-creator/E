<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры (быстро)</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:#f0f2f5; padding:16px; display:flex; justify-content:center; }
        .app { max-width:900px; width:100%; background:#fff; border-radius:24px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .header h1 { font-size:1.8rem; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
        .card { background:#f8f9fa; border-radius:16px; padding:12px; text-align:center; transition:0.1s; cursor:default; border:1px solid #e9ecef; }
        .card:hover { background:#e9ecef; }
        .card .icon { font-size:2.6rem; }
        .card h3 { font-size:0.95rem; margin:4px 0; }
        .card .desc { font-size:0.7rem; color:#6c757d; }
        .btn { background:#0d6efd; color:#fff; border:none; padding:6px 0; width:100%; border-radius:40px; font-weight:600; cursor:pointer; margin-top:6px; }
        .btn:hover { background:#0b5ed7; }
        #game-container { display:none; background:#f8f9fa; border-radius:16px; padding:12px; margin-top:12px; }
        #game-container.active { display:block; }
        #game-canvas { display:block; margin:0 auto; background:#fff; border-radius:8px; width:100%; max-width:640px; height:auto; aspect-ratio:16/10; }
        .controls { display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px; }
        .controls .info { font-size:0.9rem; background:#e9ecef; padding:4px 16px; border-radius:30px; }
        .close-btn { background:#dc3545; color:#fff; border:none; padding:6px 20px; border-radius:30px; font-weight:600; cursor:pointer; }
        .close-btn:hover { background:#c82333; }
        .footer { margin-top:16px; border-top:1px solid #dee2e6; padding-top:12px; font-size:0.8rem; color:#6c757d; display:flex; justify-content:space-between; }
        @media (max-width:500px) { .grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>
<div class="app">
    <div class="header"><h1>⚡ Игры</h1><span>быстро</span></div>

    <div class="grid" id="game-grid">
        <div class="card" data-game="snake"><div class="icon">🐍</div><h3>Snake</h3><div class="desc">стрелки</div><button class="btn">Играть</button></div>
        <div class="card" data-game="breakout"><div class="icon">🧱</div><h3>Breakout</h3><div class="desc">мышь</div><button class="btn">Играть</button></div>
        <div class="card" data-game="tictac"><div class="icon">❌⭕</div><h3>Крестики</h3><div class="desc">клик</div><button class="btn">Играть</button></div>
        <div class="card" data-game="guess"><div class="icon">🔢</div><h3>Угадай</h3><div class="desc">ввод</div><button class="btn">Играть</button></div>
        <div class="card" data-game="memory"><div class="icon">🃏</div><h3>Memory</h3><div class="desc">клик</div><button class="btn">Играть</button></div>
        <div class="card" data-game="invaders"><div class="icon">👾</div><h3>Invaders</h3><div class="desc">мышь+пробел</div><button class="btn">Играть</button></div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="640" height="400"></canvas>
        <div class="controls">
            <span class="info" id="game-status">🎮</span>
            <button class="close-btn" id="close-game">✕ Закрыть</button>
        </div>
    </div>

    <div class="footer"><span>6 игр</span><span>⌨️ / 🖱️</span></div>
</div>

<script>
// ============================================================
//  ОБЩЕЕ
// ============================================================
const grid = document.getElementById('game-grid');
const container = document.getElementById('game-container');
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('game-status');
const closeBtn = document.getElementById('close-game');

let currentCleanup = null;
let animId = null;
let running = false;
const W = 640, H = 400;

function stopGame() {
    running = false;
    if (animId) cancelAnimationFrame(animId);
    if (currentCleanup) { currentCleanup(); currentCleanup = null; }
}

function startGame(name) {
    stopGame();
    container.classList.add('active');
    grid.style.display = 'none';
    running = true;
    const fn = games[name];
    if (fn) {
        const res = fn();
        currentCleanup = res.cleanup || null;
        statusEl.textContent = '🎮 ' + name;
    } else {
        statusEl.textContent = '❌ ошибка';
        running = false;
    }
}

closeBtn.addEventListener('click', ()=>{
    stopGame();
    container.classList.remove('active');
    grid.style.display = 'grid';
    statusEl.textContent = '🎮';
});

document.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('click', (e)=>{
        const card = e.target.closest('.card');
        startGame(card.dataset.game);
    });
});

// ============================================================
//  ИГРЫ (максимально лёгкие)
// ============================================================

// ----- SNAKE -----
function gameSnake() {
    const CELL = 18;
    const cols = Math.floor(W/CELL), rows = Math.floor(H/CELL);
    let snake = [{x:8,y:8}];
    let food = {x:12,y:8};
    let dir = {x:1,y:0}, nextDir = {x:1,y:0};
    let score = 0, gameOver = false;

    function onKey(e) {
        const k = e.key;
        if (k === 'ArrowUp' && dir.y===0) nextDir = {x:0,y:-1};
        else if (k === 'ArrowDown' && dir.y===0) nextDir = {x:0,y:1};
        else if (k === 'ArrowLeft' && dir.x===0) nextDir = {x:-1,y:0};
        else if (k === 'ArrowRight' && dir.x===0) nextDir = {x:1,y:0};
    }
    window.addEventListener('keydown', onKey);

    function spawnFood() {
        food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    }
    spawnFood();

    function update() {
        if (gameOver) return;
        dir = {...nextDir};
        let head = {...snake[0]};
        head.x += dir.x; head.y += dir.y;
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) { gameOver = true; return; }
        for (let s of snake) if (s.x===head.x && s.y===head.y) { gameOver = true; return; }
        snake.unshift(head);
        if (head.x===food.x && head.y===food.y) { score += 10; spawnFood(); }
        else snake.pop();
    }

    function draw() {
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#28a745';
        snake.forEach(s => ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2));
        ctx.fillStyle = '#dc3545';
        ctx.fillRect(food.x*CELL+1, food.y*CELL+1, CELL-2, CELL-2);
        ctx.fillStyle = '#212529';
        ctx.font = '14px sans-serif';
        ctx.fillText('🐍 '+score, 8, 20);
        if (gameOver) { ctx.fillStyle = '#dc3545'; ctx.font = '24px sans-serif'; ctx.fillText('GAME OVER', W/2-70, H/2); }
    }

    function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ window.removeEventListener('keydown', onKey); } };
}

// ----- BREAKOUT (мышь) -----
function gameBreakout() {
    let paddle = { x: W/2-40, y: H-30, w: 80, h: 10 };
    let ball = { x: W/2, y: H-40, vx: 2.5, vy: -3.5, r: 6 };
    let bricks = [];
    let score = 0, lives = 3;
    for (let r=0; r<4; r++) for (let c=0; c<9; c++)
        bricks.push({ x: c*62+30, y: r*22+20, w: 52, h: 14, alive: true });

    function onMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / rect.width;
        paddle.x = (e.clientX - rect.left)*scale - paddle.w/2;
        paddle.x = Math.max(0, Math.min(W-paddle.w, paddle.x));
    }
    canvas.addEventListener('mousemove', onMouse);

    function update() {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < 8 || ball.x > W-8) ball.vx *= -1;
        if (ball.y < 8) ball.vy *= -1;
        if (ball.y > H) { lives--; ball.x=W/2; ball.y=H-40; ball.vx=2.5; ball.vy=-3.5; if (lives<=0) running=false; }

        if (ball.y+ball.r > paddle.y && ball.y-ball.r < paddle.y+paddle.h &&
            ball.x > paddle.x && ball.x < paddle.x+paddle.w) {
            ball.vy = -Math.abs(ball.vy);
            ball.vx += (ball.x - (paddle.x+paddle.w/2))*0.1;
            if (Math.abs(ball.vx)>5) ball.vx = Math.sign(ball.vx)*5;
        }

        bricks.forEach(b => {
            if (!b.alive) return;
            if (ball.x > b.x && ball.x < b.x+b.w && ball.y > b.y && ball.y < b.y+b.h) {
                b.alive = false; score += 10; ball.vy *= -1;
            }
        });
    }

    function draw() {
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#0d6efd'; bricks.forEach(b => { if(b.alive) ctx.fillRect(b.x,b.y,b.w,b.h); });
        ctx.fillStyle = '#0d6efd'; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
        ctx.fillStyle = '#dc3545'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#212529'; ctx.font='14px sans-serif'; ctx.fillText('🧱 '+score, 8,20); ctx.fillText('❤️ '.repeat(lives), W-70,20);
    }

    function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ canvas.removeEventListener('mousemove', onMouse); } };
}

// ----- TIC-TAC-TOE -----
function gameTictac() {
    let board = Array(9).fill(null);
    let turn = 'X';
    let winner = null;
    let scores = {X:0, O:0};

    function check() {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let l of lines) {
            const [a,b,c] = l;
            if (board[a] && board[a]===board[b] && board[a]===board[c]) return board[a];
        }
        if (board.every(v=>v)) return 'draw';
        return null;
    }

    function onClick(e) {
        if (winner) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left)*scaleX;
        const my = (e.clientY - rect.top)*scaleY;
        const cell = W/3;
        const col = Math.floor(mx/cell), row = Math.floor(my/cell);
        const idx = row*3 + col;
        if (board[idx]) return;
        board[idx] = turn;
        const w = check();
        if (w) {
            if (w !== 'draw') scores[w]++;
            winner = w;
        } else {
            turn = (turn === 'X') ? 'O' : 'X';
        }
    }
    canvas.addEventListener('click', onClick);

    function reset() { board.fill(null); turn='X'; winner=null; }

    function draw() {
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
        const cell = W/3;
        ctx.strokeStyle='#adb5bd'; ctx.lineWidth=2;
        for (let i=1; i<3; i++) {
            ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,H); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke();
        }
        ctx.font='42px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        for (let i=0;i<9;i++) {
            const r=Math.floor(i/3), c=i%3;
            ctx.fillStyle = board[i]==='X' ? '#0d6efd' : '#dc3545';
            ctx.fillText(board[i]||'', c*cell+cell/2, r*cell+cell/2);
        }
        ctx.fillStyle='#212529'; ctx.font='14px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText('X:'+scores.X+'  O:'+scores.O, 8,8);
        if (winner) {
            ctx.fillStyle='#198754'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
            ctx.fillText(winner==='draw' ? 'Ничья!' : 'Победил '+winner, W/2, H-8);
            setTimeout(reset, 1200);
        }
    }

    function loop() { if (!running) return; draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ canvas.removeEventListener('click', onClick); } };
}

// ----- GUESS NUMBER -----
function gameGuess() {
    let target = Math.floor(Math.random()*100)+1;
    let attempts = 0;
    let msg = 'Введите число 1–100';
    let input = '';
    let over = false;

    function onKey(e) {
        if (over) return;
        if (e.key === 'Enter') {
            const n = parseInt(input);
            if (isNaN(n) || n<1 || n>100) { msg = '❌ от 1 до 100'; }
            else {
                attempts++;
                if (n === target) { msg = '🎉 Угадал за '+attempts+'!'; over = true; }
                else if (n < target) msg = '⬆️ Больше (попытка '+attempts+')';
                else msg = '⬇️ Меньше (попытка '+attempts+')';
            }
            input = '';
            return;
        }
        if (e.key === 'Backspace') input = input.slice(0,-1);
        else if (e.key >= '0' && e.key <= '9' && input.length < 3) input += e.key;
    }
    window.addEventListener('keydown', onKey);

    function draw() {
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#212529'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='24px sans-serif'; ctx.fillText('🔢 Угадай число', W/2, 60);
        ctx.font='18px sans-serif'; ctx.fillText(msg, W/2, 120);
        ctx.font='32px sans-serif'; ctx.fillStyle='#0d6efd'; ctx.fillText(input || '_', W/2, 200);
        ctx.font='14px sans-serif'; ctx.fillStyle='#6c757d'; ctx.fillText('Enter → проверить', W/2, 270);
    }

    function loop() { if (!running) return; draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ window.removeEventListener('keydown', onKey); } };
}

// ----- MEMORY -----
function gameMemory() {
    const emojis = ['🍎','🍌','🍒','🍇','🍉','🍓','🍑','🍊'];
    let cards = [];
    let flipped = [], matched = [], locked = false, score = 0;

    function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
    function init() {
        const deck = shuffle([...emojis, ...emojis]);
        cards = deck.map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
        flipped=[]; matched=[]; locked=false; score=0;
    }
    init();

    function onClick(e) {
        if (locked) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left)*scaleX;
        const my = (e.clientY - rect.top)*scaleY;
        const cols=8, rows=2;
        const cw = W/cols, ch = H/rows;
        const col = Math.floor(mx/cw), row = Math.floor(my/ch);
        const idx = row*cols + col;
        if (idx >= cards.length) return;
        const card = cards[idx];
        if (card.flipped || card.matched) return;
        card.flipped = true;
        flipped.push(card);
        if (flipped.length === 2) {
            locked = true;
            if (flipped[0].emoji === flipped[1].emoji) {
                flipped[0].matched = true; flipped[1].matched = true;
                score += 10;
                flipped = [];
                locked = false;
                if (cards.every(c=>c.matched)) setTimeout(()=>{ alert('🏆 Победа! '+score); }, 100);
            } else {
                setTimeout(()=>{ flipped[0].flipped=false; flipped[1].flipped=false; flipped=[]; locked=false; }, 500);
            }
        }
    }
    canvas.addEventListener('click', onClick);

    function draw() {
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
        const cols=8, rows=2, cw=W/cols, ch=H/rows;
        for (let i=0; i<cards.length; i++) {
            const r=Math.floor(i/cols), c=i%cols;
            const x=c*cw, y=r*ch;
            const card = cards[i];
            ctx.fillStyle = card.matched ? '#dee2e6' : (card.flipped ? '#e9ecef' : '#0d6efd');
            ctx.fillRect(x+4, y+4, cw-8, ch-8);
            if (card.flipped || card.matched) {
                ctx.fillStyle='#212529'; ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(card.emoji, x+cw/2, y+ch/2);
            }
        }
        ctx.fillStyle='#212529'; ctx.font='14px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText('🃏 '+score, 8,8);
    }

    function loop() { if (!running) return; draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ canvas.removeEventListener('click', onClick); } };
}

// ----- INVADERS (упрощённый) -----
function gameInvaders() {
    let player = { x: W/2, y: H-40, w: 34, h: 18 };
    let bullets = [];
    let enemies = [];
    let score = 0, lives = 3, dir = 1, speed = 1.2, frame = 0;

    function initEnemies() {
        enemies = [];
        for (let r=0; r<3; r++) for (let c=0; c<7; c++)
            enemies.push({ x: 50+c*60, y: 20+r*32, w: 28, h: 22, alive: true });
    }
    initEnemies();

    function onMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / rect.width;
        player.x = (e.clientX - rect.left)*scale;
        player.x = Math.max(17, Math.min(W-17, player.x));
    }
    canvas.addEventListener('mousemove', onMouse);

    function onKey(e) {
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            if (bullets.length < 5) bullets.push({ x: player.x, y: player.y-14, w:3, h:10 });
        }
    }
    window.addEventListener('keydown', onKey);

    function update() {
        frame++;
        bullets.forEach(b => b.y -= 4);
        bullets = bullets.filter(b => b.y > 0);

        let edge = false;
        enemies.forEach(e => {
            if (!e.alive) return;
            e.x += speed * dir;
            if (e.x < 10 || e.x > W-38) edge = true;
        });
        if (edge) { dir *= -1; enemies.forEach(e => e.y += 6); speed += 0.05; }

        bullets.forEach(b => {
            enemies.forEach(e => {
                if (!e.alive) return;
                if (b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h) {
                    e.alive = false; score += 10; b.dead = true;
                }
            });
        });
        bullets = bullets.filter(b => !b.dead);

        if (frame % 30 === 0) {
            const alive = enemies.filter(e => e.alive && !e.isBullet);
            if (alive.length) {
                const e = alive[Math.floor(Math.random()*alive.length)];
                enemies.push({ x: e.x+10, y: e.y+24, w:6, h:10, alive:true, isBullet:true });
            }
        }
        enemies.forEach(e => { if (e.isBullet) e.y += 2.5; });
        enemies = enemies.filter(e => !(e.isBullet && e.y > H));

        enemies.forEach(e => {
            if (!e.isBullet) return;
            if (e.x > player.x-14 && e.x < player.x+14 && e.y > player.y-14 && e.y < player.y+14) {
                e.alive = false; lives--;
                if (lives <= 0) running = false;
            }
        });

        if (enemies.filter(e => e.alive && !e.isBullet).length === 0) {
            score += 50; initEnemies(); speed = 1.2;
        }
    }

    function draw() {
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#0d6efd';
        ctx.fillRect(player.x-17, player.y-9, 34, 18);
        ctx.fillStyle='#6ea8fe';
        ctx.fillRect(player.x-10, player.y-16, 20, 8);

        ctx.fillStyle='#dc3545';
        bullets.forEach(b => ctx.fillRect(b.x-1.5, b.y-5, 3, 10));

        enemies.forEach(e => {
            if (!e.alive) return;
            if (e.isBullet) {
                ctx.fillStyle='#dc3545';
                ctx.fillRect(e.x-3, e.y-5, 6, 10);
            } else {
                ctx.fillStyle='#28a745';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle='#8fdf8f';
                ctx.fillRect(e.x+6, e.y-4, 6, 4);
                ctx.fillRect(e.x+16, e.y-4, 6, 4);
            }
        });

        ctx.fillStyle='#212529'; ctx.font='14px sans-serif';
        ctx.fillText('👾 '+score, 8,20);
        ctx.fillText('❤️ '.repeat(lives), W-70,20);
        if (lives <= 0) { ctx.fillStyle='#dc3545'; ctx.font='24px sans-serif'; ctx.fillText('GAME OVER', W/2-70, H/2); }
    }

    function loop() { if (!running) return; update(); draw(); animId = requestAnimationFrame(loop); }
    loop();
    return { cleanup: ()=>{ canvas.removeEventListener('mousemove', onMouse); window.removeEventListener('keydown', onKey); } };
}

// ============================================================
//  РЕЕСТР
// ============================================================
const games = {
    snake: gameSnake,
    breakout: gameBreakout,
    tictac: gameTictac,
    guess: gameGuess,
    memory: gameMemory,
    invaders: gameInvaders,
};
</script>
</body>
</html>
